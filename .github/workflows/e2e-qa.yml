name: E2E Tests (QA)

# Manual/scheduled only, not on every push - these tests depend on seeded
# QA data existing and hit a resource-constrained shared backend (see
# playwright.config.ts), so tying them to every deploy would make failures
# ambiguous (code regression vs. stale/missing data vs. QA under load).
on:
  workflow_dispatch: {}

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run e2e suite against QA
        env:
          QA_BASE_URL: https://qa.meritlense.com
        run: npx playwright test

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
